name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare the tag with the workspace version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ -z "$cargo_version" ]; then
            echo "::error::no version found in Cargo.toml"
            exit 1
          fi
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $cargo_version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-agent:
    name: Build the agent (${{ matrix.target }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: cross build --release --locked -p cerbrix-agent --target "${{ matrix.target }}"
      - name: Package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="cerbrix-agent-${VERSION}-${TARGET}.tar.gz"
          mkdir -p stage dist
          cp "target/${TARGET}/release/cerbrix-agent" stage/cerbrix-agent
          cp deploy/cerbrix-agent.service stage/cerbrix-agent.service
          tar --owner=0 --group=0 -czf "dist/${name}" -C stage cerbrix-agent cerbrix-agent.service
          (cd dist && sha256sum "${name}" > "${name}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [verify, build-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          args=()
          case "$VERSION" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cerbrix $VERSION" \
            --generate-notes \
            "${args[@]}" \
            dist/* scripts/install-agent.sh

  server-image:
    name: Push the server image
    needs: [verify, build-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the image tags
        id: tags
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "tags=ghcr.io/trismarzec/cerbrix-server:${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
