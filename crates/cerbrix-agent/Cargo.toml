[package]
name = "cerbrix-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
cerbrix-common = { version = "0.1.0", path = "../cerbrix-common" }
