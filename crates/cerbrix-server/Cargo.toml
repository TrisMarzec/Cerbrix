[package]
name = "cerbrix-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1.92"
axum.workspace = true
axum-server.workspace = true
base64 = "0.23.1"
cerbrix-common = { version = "0.1.0", path = "../cerbrix-common" }
clap.workspace = true
figment.workspace = true
http-body-util = "0.1.5"
rand = "0.10.3"
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "time", "macros", "json"] }
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["signal", "fs", "sync", "time", "net", "process"] }
tokio-util.workspace = true
tower-http = { version = "0.7.1", features = ["timeout"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
rcgen.workspace = true
tempfile.workspace = true
tower = { version = "0.5.3", features = ["util"] }
wiremock.workspace = true

[features]
test-util = []
