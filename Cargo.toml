[workspace]
resolver = "3"
members = [
    "crates/cerbrix-common",
    "crates/cerbrix-server",
    "crates/cerbrix-agent",
    "crates/cerbrix-proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
figment = { version = "0.10.19", features = ["toml", "env"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
time = "0.3.55"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"
url = "2.5.8"
wiremock = "0.6.5"
