[workspace]
resolver = "3"
members = [
    "crates/cerbrix-common",
    "crates/cerbrix-server",
    "crates/cerbrix-agent",
    "crates/cerbrix-proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
figment = { version = "0.10.19", features = ["toml", "env"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.2", features = ["v4"] }
time = "0.3.55"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
