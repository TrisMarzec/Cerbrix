# Cerbrix server installation: PostgreSQL, VictoriaMetrics and the server.
# Configuration comes from deploy/server.env (copy deploy/server.env.example).
name: cerbrix-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: ${CERBRIX_ENV_FILE:-deploy/server.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0
    restart: unless-stopped
    command:
      # Months without a unit; 90d or 2y are possible. See "Retention" in docs/install.md.
      - "-retentionPeriod=${CERBRIX_METRICS_RETENTION:-12}"
      - "-storageDataPath=/victoria-metrics-data"
    ports:
      # Bound to localhost only: VictoriaMetrics has no authentication.
      - "127.0.0.1:${CERBRIX_VM_PORT:-8428}:8428"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    image: cerbrix-server:local
    restart: unless-stopped
    env_file: ${CERBRIX_ENV_FILE:-deploy/server.env}
    depends_on:
      postgres:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    ports:
      # Local machine only by default; see "Making the server reachable for agents"
      # in docs/install.md before setting CERBRIX_SERVER_BIND=0.0.0.0.
      - "${CERBRIX_SERVER_BIND:-127.0.0.1}:${CERBRIX_SERVER_PORT:-8443}:8443"
    volumes:
      # Git checkout cache for the configuration repository (see GitOps in
      # docs/install.md). The image creates the directory owned by the server user.
      - git-cache:/var/lib/cerbrix/git
      # To serve TLS directly, mount the certificate and key (read-only) and set
      # CERBRIX_SERVER__TLS_CERT / CERBRIX_SERVER__TLS_KEY in deploy/server.env:
      # - ./tls:/etc/cerbrix/tls:ro
      # For an SSH key and known_hosts file, see docs/install.md.

volumes:
  git-cache:
  postgres-data:
  victoriametrics-data:
