services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cerbrix
      POSTGRES_PASSWORD: cerbrix
      POSTGRES_DB: cerbrix
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  victoriametrics:
    image: victoriametrics/victoria-metrics
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics-data:/victoria-metrics-data

volumes:
  postgres-data:
  victoriametrics-data:
